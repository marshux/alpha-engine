# Deploy from the repo root: flyctl deploy
# (build.dockerfile is relative to this file's directory, i.e. repo root)

app = "alpha-engine-dash"
primary_region = "iad"

[build]
  dockerfile = "web/backend/Dockerfile"

[env]
  ENABLE_SCHEDULER = "true"
  # Unlike ENABLE_SCHEDULER (the general cron on/off switch), real account
  # interaction (even paper) gets its own explicit opt-in. The dashboard's
  # manual "Rebalance now"/"Flatten to cash" buttons work regardless of
  # this flag; this only gates the unattended weekly cron job
  # (app/jobs/tasks.py::weekly_paper_rebalance). Enabled 2026-08-13 after
  # the first manual rebalance was verified against the real (paper)
  # Alpaca account and a cadence sweep (output/cadence_window_sweep.csv)
  # confirmed weekly beats daily across every train/test window size
  # tested.
  ENABLE_LIVE_TRADING = "true"
  # DATABASE_PATH intentionally unset -- app/database.py's default
  # (<repo_root>/data/web.db) already resolves under the mounted volume
  # below, same as alpha_engine's price/fundamentals cache and the
  # generated tear sheets (see src/alpha_engine/data/cache.py, which
  # isn't independently configurable, so the volume has to land exactly
  # where the code already expects "data/" to be: /app/data).

[[mounts]]
  source = "alpha_engine_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
