[project]
name = "alpha-engine"
version = "0.1.0"
description = "Systematic swing-trading research engine: quant + AI-news signals feeding a deterministic decision layer, backtested against index benchmarks."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "anthropic>=0.34",
    "pyyaml>=6.0",
    "pyarrow>=16.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]
live = ["alpaca-py>=0.30"]

[project.scripts]
alpha-engine = "alpha_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Scoped to the core engine's tests -- web/backend/tests/ has its own
# "tests" package name and its own import root (web/backend/), which
# collides with this one if both get collected in the same pytest run.
# Run the web backend's tests separately, from within web/backend/.
testpaths = ["tests"]
