[project]
name = "alpha-engine"
version = "0.1.0"
description = "Systematic swing-trading research engine: quant + AI-news signals feeding a deterministic decision layer, backtested against index benchmarks."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "anthropic>=0.34",
    "pyyaml>=6.0",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
alpha-engine = "alpha_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
