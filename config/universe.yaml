# Tradable universe for v1. Explicit ticker lists rather than scraping live
# S&P 500 membership: membership changes over time, and silently following
# an index's current constituent list into a historical backtest introduces
# survivorship bias. This list should be revisited deliberately, not auto-updated.

benchmarks:
  - SPY
  - VOO
  - VTI

sector_etfs:
  - XLK   # Technology
  - XLF   # Financials
  - XLE   # Energy
  - XLV   # Health Care
  - XLI   # Industrials
  - XLY   # Consumer Discretionary
  - XLP   # Consumer Staples
  - XLU   # Utilities
  - XLB   # Materials
  - XLRE  # Real Estate
