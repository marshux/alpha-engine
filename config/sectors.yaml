# Hand-curated GICS sector for every symbol in universe.yaml (large_caps +
# sector_etfs). Hand-curated rather than fetched for the same reason
# universe.yaml is: deterministic, no flaky data dependency, no silent
# drift. Uses the same sector-name vocabulary as the sector ETFs so an
# individual stock and its sector ETF, if both held, count toward the same
# decision/portfolio.py sector cap.
#
# tests/test_config.py asserts every large_cap/sector_etf symbol has an
# entry here -- add one whenever a new ticker is added to universe.yaml.

# Sector ETFs -- each one's "sector" is the sector it represents.
