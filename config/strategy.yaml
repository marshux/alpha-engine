# Strategy parameters consumed by the deterministic decision engine
# (src/alpha_engine/decision/*). Changing weights/thresholds here changes
# backtest behavior without touching code.

rebalance: weekly  # weekly | biweekly | monthly

signal_weights:
  momentum: 0.3
  mean_reversion: 0.2
  volatility: 0.1     # lower realized vol scores higher (risk-adjusted tilt)
  value: 0.15         # cheapness via trailing P/B -- only applied when
                      # --fundamentals is passed (see cli.py); coverage is
                      # thin for older backtest dates, see signals/value.py
  quality: 0.15       # ROE + low leverage composite -- same fundamentals
                      # coverage caveat as value, see signals/quality.py
  news_ai: 0.1        # only applied in live/paper trading -- the backtester
                      # never supplies a news_ai column (web search can't be
                      # date-scoped to the past, see signals/news_ai.py), so
                      # this weight has no effect on historical backtests
  ai_theme: 0.15      # deliberate directional tilt toward AI-exposed names
                      # (config/themes.yaml) -- NOT a backtested academic
                      # factor like the others, a discretionary bet. Risk is
                      # capped separately by portfolio.max_theme_weight below,
                      # not by anything in the signal itself. See
                      # signals/ai_theme.py.

portfolio:
  top_n: 10                  # number of positions held at any time -- walk-forward
                              # (2008-2024, 14 windows) picked 10 over 15 in 8/14 windows
  max_position_weight: 0.12  # single-position cap
  max_sector_weight: 0.30    # sector exposure cap (sector ETFs count as their own sector)
  max_theme_weight: 0.35     # hedge: caps total portfolio weight in AI-tagged
                              # names regardless of how strongly they rank
                              # (see decision/portfolio.apply_theme_cap)
  sizing: equal_weight       # volatility_scaled | equal_weight | min_variance -- walk-forward
                              # picked equal_weight in 8/14 windows vs. 2/14 for
                              # volatility_scaled (the prior default); the fancier
                              # vol-aware sizing didn't reliably earn its complexity

risk:
  stop_loss_pct: 0.15        # per-position stop, evaluated at each rebalance
  max_drawdown_pct: 0.20     # portfolio-level circuit breaker -> flatten to cash
  circuit_breaker_cooldown_periods: 8   # rebalances to hold cash after the
                                         # breaker fires before re-entering;
                                         # on re-entry the drawdown reference
                                         # point resets to that period's
                                         # equity (see backtest/engine.py) --
                                         # otherwise the strategy could never
                                         # recover from a frozen pre-crash peak

regime:
  enabled: true         # Faber-style trend filter: hold equities only when
                         # the benchmark is above its own trailing moving
                         # average, otherwise sit in cash -- risk-timing,
                         # not stock-picking (see decision/risk.py). Needs
                         # benchmark_prices passed to run_backtest to take
                         # effect at all (cli.py does this automatically).
                         # Walk-forward (2008-2024) only picked this in 3/14
                         # windows by train-Sharpe -- but train-Sharpe doesn't
                         # price in tail risk, and the one catastrophic OOS
                         # window (2022, momentum-heavy, regime off, CAGR
                         # -23.7%) is exactly the failure mode this exists to
                         # catch. Kept on deliberately despite "losing" the
                         # per-window vote.
  ma_window_days: 200   # Faber's classic timing-model window

costs:
  commission_bps: 1.0
  slippage_bps: 5.0

backtest:
  initial_capital: 100000
  benchmark: SPY
